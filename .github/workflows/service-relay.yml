name: Single-installation relay
on:
  push:
    branches: [main]
    paths: ['server/relay*.mjs', 'shared/routing-profiles.mjs', 'server/lan-workspaces.mjs', 'scripts/gateway-fixture.mjs', 'scripts/gateway-deployment-fixture.mjs', 'scripts/relay-fixture.mjs', 'scripts/routing-fixture.mjs', 'scripts/routing-windows-fixture.mjs', 'scripts/check-service-relay.sh', '.github/workflows/service-relay.yml']
  pull_request:
    paths: ['server/relay*.mjs', 'shared/routing-profiles.mjs', 'server/lan-workspaces.mjs', 'scripts/gateway-fixture.mjs', 'scripts/gateway-deployment-fixture.mjs', 'scripts/relay-fixture.mjs', 'scripts/routing-fixture.mjs', 'scripts/routing-windows-fixture.mjs', 'scripts/check-service-relay.sh', '.github/workflows/service-relay.yml']

permissions:
  contents: read

jobs:
  windows-route:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/routing-windows-fixture.mjs
      - run: node --test server/relay-gateway.check.mjs server/relay-gateway-deployment.check.mjs
  three-hosts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit
      - run: node --test server/relay-gateway.check.mjs server/relay-gateway-deployment.check.mjs server/relay.check.mjs
      - name: Install test SSH and FTP servers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-server python3-pyftpdlib wireguard-tools iptables
      - name: Verify single-installation service relays and bidirectional IPv4 routing
        run: sudo unshare --mount --propagation private --net --pid --fork --mount-proc bash scripts/check-service-relay.sh "$(command -v node)" "$(id -un)"
