name: Single-installation relay
on:
  push:
    branches: [main]
    paths: ['server/relay*.mjs', 'server/lan-workspaces.mjs', 'scripts/relay-fixture.mjs', 'scripts/check-service-relay.sh', '.github/workflows/service-relay.yml']
  pull_request:
    paths: ['server/relay*.mjs', 'server/lan-workspaces.mjs', 'scripts/relay-fixture.mjs', 'scripts/check-service-relay.sh', '.github/workflows/service-relay.yml']

permissions:
  contents: read

jobs:
  three-hosts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit
      - name: Install test SSH and FTP servers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-server python3-pyftpdlib
      - name: Verify each single-host installation with SSH, SFTP, FTP and HTTP
        run: sudo unshare --mount --propagation private --net --pid --fork --mount-proc bash scripts/check-service-relay.sh "$(command -v node)" "$(id -un)"
