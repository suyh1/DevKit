name: Linux ARM64 portal interaction
on: workflow_dispatch
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run build
      - name: Install ARM64 browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.55.0
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium firefox
          sudo apt-get install -y fonts-noto-cjk
      - name: Click portal dropdowns and measure the upload button
        run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" xvfb-run -a node scripts/check-arm64-portal.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-browser-screenshots
          path: artifacts/arm64-portal
