name: Build and release DevKit

on:
  push:
    branches: [main]
    tags: ['[0-9]*', 'v[0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      full_regression:
        description: Run the full platform and Electron window regression suite
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run test:docs
      - run: npm test
      - run: npm run test:projects
      - run: npm run test:http
      - name: Check packaging scripts
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: |
          npm run test:release
          python scripts/test-deb-packaging.py
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          name: frontend
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  package:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            format: nsis
            artifact: windows-x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            format: deb
            artifact: linux-x64
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            format: deb
            artifact: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      # The release collector compares the actual packaged source bytes across platforms.
      - name: Match Linux checkout line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        if: inputs.full_regression
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --ignore-scripts --no-audit
      - name: Extended platform regression
        if: inputs.full_regression
        shell: bash
        run: |
          npm run test:desktop
          npm run test:nginx
          npm run test:jar
          npm run test:monitor
          npm run test:logs
          npm run test:java
      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: dist
      - name: LAN sharing settings, file downloads and Todo integration
        if: runner.os == 'Windows' && inputs.full_regression
        run: node scripts/smoke-desktop.mjs --sharing-settings-only
      - name: Electron integration smoke
        if: runner.os == 'Windows' && inputs.full_regression
        run: node scripts/smoke-desktop.mjs --without-sharing-settings
      - name: Offline API workspace integration
        if: runner.os == 'Windows' && inputs.full_regression
        run: node scripts/smoke-desktop.mjs --api-only
      - name: LAN workspaces browser integration
        if: runner.os == 'Windows' && inputs.full_regression
        run: node scripts/smoke-sharing.mjs
      - name: JAR shared application console integration
        if: runner.os == 'Windows' && inputs.full_regression
        run: node scripts/smoke-jar-sharing.mjs
      - name: Monitoring desktop and shared status page
        if: runner.os == 'Windows' && inputs.full_regression
        run: node scripts/smoke-desktop.mjs --monitor-only
      - name: Logs and responsive workspace navigation
        if: runner.os == 'Windows' && inputs.full_regression
        run: node scripts/smoke-desktop.mjs --logs-only
      - name: Portal native interaction and LAN clipboard regression
        if: runner.os == 'Windows' && inputs.full_regression
        run: node scripts/smoke-portal.mjs
      - run: node scripts/package-desktop.mjs --platform=${{ matrix.platform }} --arch=${{ matrix.arch }} --format=${{ matrix.format }}
        env:
          DEVKIT_KEEP_PACKAGE_RUNTIME: ${{ (runner.os == 'Windows' && inputs.full_regression) && '1' || '0' }}
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
      - name: Verify packaged offline API workspace
        if: runner.os == 'Windows' && inputs.full_regression
        run: node scripts/smoke-desktop.mjs --packaged --api-only
      - name: Verify packaged LAN workspaces
        if: runner.os == 'Windows' && inputs.full_regression
        run: node scripts/smoke-sharing.mjs --packaged
      - name: Verify packaged portal native interaction
        if: runner.os == 'Windows' && inputs.full_regression
        run: node scripts/smoke-portal.mjs --packaged
      - name: Verify configs preservation in NSIS cleanup
        if: runner.os == 'Windows'
        run: node scripts/check-configs-installer.mjs
      - name: Remove packaging work directories
        if: runner.os == 'Windows'
        run: npm run clean:artifacts
      - name: Verify Debian package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for package in artifacts/${{ matrix.artifact }}/*.deb; do
            dpkg-deb --info "$package"
            if dpkg-deb -f "$package" Depends | grep -qi webkit; then exit 1; fi
            sudo dpkg --unpack "$package"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            artifacts/${{ matrix.artifact }}/*.exe
            artifacts/${{ matrix.artifact }}/*.deb
            artifacts/${{ matrix.artifact }}/*.txt
            artifacts/${{ matrix.artifact }}/*.json
            artifacts/${{ matrix.artifact }}/README.md
            artifacts/${{ matrix.artifact }}/docs/
            artifacts/${{ matrix.artifact }}/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  project-server:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit
      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: dist
      - run: node scripts/package-project-server.mjs
      - run: node scripts/check-project-server.mjs
      - name: Read release directory
        id: release-directory
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "path=artifacts/release-$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: project-center-node24
          path: |
            ${{ steps.release-directory.outputs.path }}/*_node24.zip
            ${{ steps.release-directory.outputs.path }}/PROJECT-SERVER-SHA256SUMS
            ${{ steps.release-directory.outputs.path }}/project-server.json
            ${{ steps.release-directory.outputs.path }}/project-server-verification.json
            ${{ steps.release-directory.outputs.path }}/README.md
            ${{ steps.release-directory.outputs.path }}/docs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [checks, package, project-server]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify version tag
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME must match package.json version $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts --no-audit
      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: dist
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-*'
      - name: Collect and verify release assets
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          node scripts/package-all.mjs --collect-only
          npm run verify:release
          release="artifacts/release-$VERSION"
          cp artifacts/project-center-node24/{DevKit_ProjectCenter_"$VERSION"_node24.zip,PROJECT-SERVER-SHA256SUMS,project-server.json,project-server-verification.json} "$release/"
          cd "$release"
          sha256sum --strict --check PROJECT-SERVER-SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          cd "artifacts/release-$VERSION"
          if is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            if [[ "$is_draft" != true ]]; then
              echo "Release $GITHUB_REF_NAME is already published" >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "DevKit $VERSION" --notes-from-tag
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber \
            *.exe *.deb *.zip SHA256SUMS PROJECT-SERVER-SHA256SUMS \
            release.json project-server.json project-server-verification.json
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
